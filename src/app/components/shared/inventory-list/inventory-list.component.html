<div class="table-responsive">
    <table class="table">
        <thead>
            <tr>
                <th width="80">Imagen</th>
                <th>Producto</th>
                <th>Marca</th>
                <th>Descripción</th>
                <th class="text-end">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of items" class="animate__animated animate__fadeIn">
                <td>
                    <div class="img-container">
                        <img *ngIf="item?.img && item?.img !== 'no-image'" 
                             [src]="item?.img" 
                             (error)="$any($event.target).src='/assets/img/no-img.webp'"
                             alt="{{ item?.name }}">
                        <!-- Placeholder si no hay imagen -->
                        <div *ngIf="!item?.img || item?.img === 'no-image'" class="placeholder-icon">
                            <i class="bi bi-box-seam"></i>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="product-name d-flex align-items-center gap-2">
                        {{ item?.name }}
                        <span class="badge rounded-pill bg-warning text-dark border border-warning-subtle small fw-semibold px-2 py-0.5" 
                              *ngIf="item?.status === 'pending_verification'" 
                              style="font-size: 0.7rem;">
                          Por Verificar
                        </span>
                    </div>
                </td>
                <td>
                    <span class="product-brand">{{ item?.brand || 'Sin marca' }}</span>
                </td>
                <td class="description-cell">
                    {{ item?.description || 'Sin descripción' }}
                </td>
                <td>
                    <div class="actions-cell justify-content-end">
                        <button class="btn btn-light btn-sm" 
                                [routerLink]="['/dashboard', userRole, 'product', 'edit', item._id]"
                                title="Editar">
                            <i class="bi bi-pencil-fill text-secondary"></i>
                        </button>
                        <button class="btn btn-light btn-sm text-danger" 
                                (click)="eliminarProduct(item._id)"
                                title="Eliminar">
                            <i class="bi bi-trash3-fill"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div *ngIf="!items || items.length === 0" class="text-center py-5">
        <i class="bi bi-box-seam text-muted" style="font-size: 3rem;"></i>
        <p class="mt-3 text-muted">No se encontraron productos.</p>
    </div>
</div>
