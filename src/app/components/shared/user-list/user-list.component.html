<div class="user-list-wrapper">
    
    <!-- Sección de Búsqueda y Acción -->
    <div class="search-section shadow-sm">
        <div class="search-header">
            <h5>Búsqueda de Usuarios</h5>
            <button class="btn btn-primary" [routerLink]="['/dashboard', userRole, 'users', 'new']">
                <i class="bi bi-person-plus-fill me-2"></i> Crear Usuario
            </button>
        </div>
        
        <div class="search-input-group d-flex gap-3">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" 
                       class="form-control border-start-0 ps-0" 
                       placeholder="Nombre, usuario o correo..." 
                       [(ngModel)]="searchTerm" 
                       (keyup)="onSearch()"
                       name="searchTerm">
            </div>

            <!-- Filtro por Sucursal (Solo para el Company Admin / Dueño) -->
            <div class="branch-filter" *ngIf="userRole === 'companyAdmin'">
                <select class="form-select" 
                        [(ngModel)]="selectedBranchId" 
                        (change)="onSearch()"
                        name="selectedBranchId">
                    <option value="">Todas las sucursales</option>
                    <option *ngFor="let b of branches" [value]="b._id">{{ b.name }}</option>
                    <option value="corporativo">Solo Corporativo (Sin sucursal)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Lista de Resultados -->
    <div class="list-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 fw-bold text-main">
                Lista de 
                <span *ngIf="userRole == 'admin'">Usuarios</span> 
                <span *ngIf="userRole == 'companyAdmin'">Colaboradores</span> 
                <span *ngIf="userRole == 'sysadmin'">Administradores</span>
                <small class="text-muted ms-2" *ngIf="company">({{ company.name }})</small>
            </h4>
        </div>

        <!-- Selector de Pestañas de Rol (Solo para el Company Admin / Dueño) -->
        <div class="role-tabs-container mb-4" *ngIf="userRole === 'companyAdmin'">
            <div class="d-flex gap-2 border-bottom pb-2">
                <button type="button" 
                        class="tab-item-btn" 
                        [class.active]="selectedRole === ''" 
                        (click)="selectRoleTab('')">
                    Todo el Personal
                </button>
                <button type="button" 
                        class="tab-item-btn" 
                        [class.active]="selectedRole === 'admin'" 
                        (click)="selectRoleTab('admin')">
                    Gerentes de Sucursal
                </button>
                <button type="button" 
                        class="tab-item-btn" 
                        [class.active]="selectedRole === 'user'" 
                        (click)="selectRoleTab('user')">
                    Cajeros y Operativos
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th width="80">Avatar</th>
                        <th>Nombre Completo</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Sucursal</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody *ngIf="users && users.length > 0">
                    <tr *ngFor="let user of users" class="animate__animated animate__fadeIn">
                        <td>
                            <div class="img-container">
                                <img *ngIf="user?.img && user?.img !== 'no-image'" 
                                     [src]="user.img" 
                                     (error)="$any($event.target).src='/assets/img/no-img.webp'"
                                     class="avatar-img" 
                                     (click)="abrirModal(user, 'usuarios')"
                                     [alt]="user.name">
                                <!-- Placeholder para usuario -->
                                <div *ngIf="!user?.img || user?.img === 'no-image'" class="placeholder-icon">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                            </div>
                        </td>
                        <td class="fw-semibold">{{ user.name || 'Sin nombre' }}</td>
                        <td class="text-muted">{{ user.username }}</td>
                        <td>
                            <span class="badge" [ngClass]="{
                                'bg-primary-subtle text-primary': user.role === 'admin',
                                'bg-success-subtle text-success': user.role === 'user',
                                'bg-warning-subtle text-warning': user.role === 'sysadmin',
                                'bg-dark-subtle text-dark': user.role === 'companyAdmin'
                            }">{{ user.role }}</span>
                        </td>
                        <td>
                            <span class="text-muted small" *ngIf="user.branch">
                                {{ $any(user.branch).name || 'Global' }}
                            </span>
                            <span class="text-muted small" *ngIf="!user.branch">
                                Corporativo
                            </span>
                        </td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-light btn-sm" (click)="navigateToCajasUsuario(user._id!)" title="Ver Cajas">
                                    <i class="bi bi-box-seam text-primary"></i>
                                </button>
                                <button class="btn btn-light btn-sm" [routerLink]="['/dashboard', userRole, 'users', 'edit', user._id]" title="Editar">
                                    <i class="bi bi-pencil-fill text-secondary"></i>
                                </button>
                                <button class="btn btn-light btn-sm text-danger" (click)="eliminarUsuario(user._id!)" title="Eliminar">
                                    <i class="bi bi-trash3-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Empty State -->
            <div class="loading-container" *ngIf="!users || users.length === 0">
                <app-loading-data-spinner *ngIf="!users"></app-loading-data-spinner>
                <div *ngIf="users && users.length === 0" class="text-center py-5">
                    <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
                    <p class="mt-3">No se encontraron usuarios.</p>
                </div>
            </div>
        </div>

        <!-- Paginación Premium -->
        <div class="pagination-container" *ngIf="totalPages >= 1">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" [class.disabled]="currentPage === 1">
                    <button class="page-link" (click)="cambiarPagina(currentPage - 1)" title="Anterior">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                </li>
                
                <li class="page-item" *ngFor="let page of visiblePages" [class.active]="page === currentPage">
                    <button class="page-link" (click)="cambiarPagina(page)">{{ page }}</button>
                </li>

                <li class="page-item" [class.disabled]="currentPage === totalPages">
                    <button class="page-link" (click)="cambiarPagina(currentPage + 1)" title="Siguiente">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
