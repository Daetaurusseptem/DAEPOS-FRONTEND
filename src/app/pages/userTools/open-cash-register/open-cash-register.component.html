<div class="container mt-4 text-white bg-dark p-4 rounded shadow">
  <h2 class="mb-4"><i class="bi bi-cash-coin me-2"></i>Bienvenido</h2>
  <div class="d-grid gap-2 mb-4">
    <button class="btn btn-dark text-white border border-light" (click)="toggleForm()">
      <i [class]="showForm ? 'bi bi-x-circle me-2' : 'bi bi-box-arrow-in-right me-2'"></i>
      {{ showForm ? 'Cancelar' : 'Abrir Caja' }}
    </button>
    <button class="btn btn-outline-light" (click)="logout()">
      <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
    </button>
  </div>

  <div *ngIf="showForm" class="mt-4">
    <h3><i class="bi bi-pencil-square me-2"></i>Configuración de Turno</h3>
    <form (ngSubmit)="openCashRegister()" class="bg-secondary p-4 rounded shadow-sm">
      
      <!-- Selección de Caja Física -->
      <div class="mb-3">
        <label for="physicalRegister" class="form-label text-white">Selecciona tu Caja Física</label>
        <select 
          id="physicalRegister" 
          class="form-select bg-dark text-white border-secondary" 
          [(ngModel)]="selectedPhysicalRegisterId" 
          name="selectedPhysicalRegisterId" 
          required>
          <option value="" disabled>Selecciona una caja...</option>
          <option *ngFor="let reg of physicalRegisters" [value]="reg._id">
            {{ reg.name }} {{ reg.isActive ? '' : '(Inactiva)' }}
          </option>
        </select>
        <div *ngIf="loadingRegisters" class="form-text text-light-50">
          <small><i class="bi bi-arrow-repeat spin"></i> Cargando cajas disponibles...</small>
        </div>
      </div>

      <!-- Monto Inicial -->
      <div class="mb-3">
        <label for="initialAmount" class="form-label text-white">Monto Inicial en Efectivo</label>
        <div class="input-group">
          <span class="input-group-text bg-dark text-white border-secondary">$</span>
          <input 
            type="number" 
            id="initialAmount" 
            class="form-control bg-dark text-white border-secondary" 
            [(ngModel)]="initialAmount" 
            name="initialAmount" 
            required 
            min="0">
        </div>
      </div>

      <button type="submit" class="btn btn-light w-100 py-2 fw-bold" [disabled]="loadingRegisters || !selectedPhysicalRegisterId">
        <i class="bi bi-box-arrow-in-right me-2"></i>Abrir Turno
      </button>
    </form>
  </div>
</div>
