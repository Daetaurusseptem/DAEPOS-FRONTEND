<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Crear Nueva Categoría</h2>
    </div>
    <div class="card-body">
      <form #categorForm="ngForm">
        <div class="mb-3">
          <label for="name" class="form-label">Nombre Categoría</label>
          <input
            type="text"
            class="form-control"
            id="name"
            [(ngModel)]="category.name"
            name="name"
            required
            placeholder="Introduce el nombre de la categoría"
          />
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Descripción Categoría</label>
          <textarea
            class="form-control"
            id="description"
            [(ngModel)]="category.description"
            name="description"
            rows="3"
            required
            placeholder="Describe la categoría"
          ></textarea>
        </div>
        <div class="mb-4">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="isOperational" [(ngModel)]="category.isOperational" name="isOperational">
            <label class="form-check-label fw-bold text-primary" for="isOperational">Categoría Operativa (Interna)</label>
            <div class="form-text mt-0">Actívalo si es una categoría de insumos operativos que <b>NO</b> debe mostrarse al cajero (ej. Limpieza).</div>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <app-back-button></app-back-button>
          <button
            type="submit"
            class="btn btn-primary"
            (click)="createCategory(categorForm)"
            [disabled]="!categorForm.form.valid"
          >
            Crear Categoría
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
