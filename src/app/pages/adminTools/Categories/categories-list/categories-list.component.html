<div class="categories-wrapper">
  <!-- Buscador -->
  <div class="search-section shadow-sm">
    <div class="search-header">
      <h5>Búsqueda de Categorías</h5>
      <button class="btn btn-primary" (click)="crearCategory()">
        <i class="bi bi-tag-fill me-2"></i> Crear Categoría
      </button>
    </div>
    <div class="search-input-group">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input
          type="text"
          class="form-control border-start-0 ps-0"
          #terminoCategoria
          placeholder="Buscar categorías por nombre o descripción..."
          (keyup)="(0)"
        />
      </div>
    </div>
  </div>

  <!-- Lista -->
  <div class="list-section">
    <h4 class="fw-bold mb-3">Lista de Categorías</h4>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Categoría</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody *ngIf="categories && categories.length > 0">
          <tr *ngFor="let category of categories" class="animate__animated animate__fadeIn">
            <td>
              <div class="category-name d-flex align-items-center gap-2">
                {{ category.name || 'No Especificado' }}
                <span
                  *ngIf="category.isOperational"
                  class="badge rounded-pill bg-warning text-dark border border-warning-subtle small fw-semibold px-2 py-0.5"
                  title="Categoría Operativa"
                >
                  Uso Interno
                </span>
              </div>
            </td>
            <td class="text-muted small">
              {{ category.description || 'Sin descripción' }}
            </td>
            <td>
              <div class="actions-cell">
                <button
                  class="btn btn-light btn-sm"
                  [routerLink]="['/dashboard/admin/edit-category', category._id]"
                  title="Editar"
                >
                  <i class="bi bi-pencil-fill text-secondary"></i>
                </button>
                <button
                  class="btn btn-light btn-sm text-danger"
                  (click)="eliminarCategory(category._id!)"
                  title="Eliminar"
                >
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Paginación Premium -->
      <div class="pagination-container" *ngIf="totalPages >= 1">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="cambiarPagina(currentPage - 1)" title="Anterior">
              <i class="bi bi-chevron-left"></i>
            </button>
          </li>

          <li class="page-item" *ngFor="let page of visiblePages" [class.active]="page === currentPage">
            <button class="page-link" (click)="cambiarPagina(page)">{{ page }}</button>
          </li>

          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="cambiarPagina(currentPage + 1)" title="Siguiente">
              <i class="bi bi-chevron-right"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
