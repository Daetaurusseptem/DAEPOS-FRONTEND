<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0 bi bi-egg-fill">Catálogo Maestro de Insumos</h2>
      <button class="btn btn-light" (click)="createRawMaterial()">Añadir Insumo Nuevo</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Unidad de Medida Base</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let material of rawMaterials">
              <td class="fw-bold text-dark">{{ material.name }}</td>
              <td class="text-secondary">{{ material.description || 'Sin descripción' }}</td>
              <td>
                <span class="badge bg-info text-dark px-3 py-2 fs-6">
                  {{ material.measurementUnit }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-2" (click)="editRawMaterial(material._id!)">
                  <i class="bi bi-pencil-square"></i> Editar
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteRawMaterial(material._id!)">
                  <i class="bi bi-trash"></i> Eliminar
                </button>
              </td>
            </tr>
            <tr *ngIf="rawMaterials.length === 0">
              <td colspan="4" class="text-center text-secondary py-4">
                No hay insumos registrados en el catálogo. ¡Crea el primero!
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
