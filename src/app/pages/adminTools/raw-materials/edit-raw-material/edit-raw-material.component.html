<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex align-items-center">
      <i class="bi bi-pencil-square me-2 fs-4"></i>
      <h2 class="mb-0">Editar Materia Prima</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Nombre del material">
          </div>
          <div class="col-md-6 mb-3">
            <label for="stock" class="form-label">Cantidad (Stock)</label>
            <input type="number" class="form-control" id="stock" formControlName="stock" min="0">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="costPrice" class="form-label">Precio Costo (Proveedor)</label>
            <input type="number" class="form-control" id="costPrice" formControlName="costPrice">
          </div>
          <div class="col-md-6 mb-3">
            <label for="measurement" class="form-label">Unidad de Medida</label>
            <select class="form-select" id="measurement" formControlName="measurement">
              <option value="grms">Gramos (g)</option>
              <option value="ml">Mililitros (ml)</option>
              <option value="kg">Kilogramos (kg)</option>
              <option value="lts">Litros (l)</option>
              <option value="unidades">Unidades</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="receivedDate" class="form-label">Fecha de Recepción</label>
            <input type="date" class="form-control" id="receivedDate" formControlName="receivedDate">
          </div>
          <div class="col-md-6 mb-3">
            <label for="expirationDate" class="form-label">Fecha de Expiración</label>
            <input type="date" class="form-control" id="expirationDate" formControlName="expirationDate">
          </div>
        </div>
        <div class="text-end mt-4">
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-outline-secondary" (click)="regresarOrCancelar()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="editForm.invalid">
              Actualizar Material
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
