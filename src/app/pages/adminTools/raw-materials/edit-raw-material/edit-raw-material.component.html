<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex align-items-center">
      <i class="bi bi-pencil-square me-2 fs-4"></i>
      <h2 class="mb-0">Editar Insumo Maestro (Materia Prima)</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="name" class="form-label">Nombre del Insumo</label>
            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Nombre del material" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="measurementUnit" class="form-label">Unidad de Medida Base</label>
            <select class="form-select" id="measurementUnit" formControlName="measurementUnit" required>
              <option value="g">Gramos (g)</option>
              <option value="ml">Mililitros (ml)</option>
              <option value="unit">Unidades (unit)</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Descripción / Detalles</label>
          <textarea class="form-control" id="description" rows="3" formControlName="description" placeholder="Añade detalles sobre el insumo..."></textarea>
        </div>
        <div class="text-end mt-4">
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-outline-secondary" (click)="regresarOrCancelar()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="editForm.invalid">
              Actualizar Insumo
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
