<div class="products-wrapper d-flex flex-column gap-4 mt-4">
  <!-- Buscador Superior -->
  <div class="search-card bg-white p-4 rounded-3 border shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Búsqueda de Productos</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" (click)="openBulkImport()">
          <i class="fi fi-rr-download me-2"></i> Importar CSV
        </button>
        <button class="btn btn-primary" (click)="crearProducto()">
          <i class="bi bi-plus-lg me-2"></i> Crear Producto
        </button>
      </div>
    </div>
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input
        type="text"
        class="form-control border-start-0 ps-0"
        #terminoProducto
        placeholder="Buscar por nombre, marca o descripción..."
        (keyup)="searchTerm$.next(terminoProducto.value)"
      />
    </div>
  </div>

  <!-- Resultados -->
  <div class="list-container">
    <div class="d-flex align-items-center mb-3">
      <h4 class="fw-bold mb-0">Catálogo de Productos</h4>
    </div>

    <items-list [items]="products"></items-list>

    <!-- Paginación Premium -->
    <div class="pagination-container" *ngIf="totalPages >= 1">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="cambiarPagina(currentPage - 1)" title="Anterior">
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>

        <li class="page-item" *ngFor="let page of visiblePages" [class.active]="page === currentPage">
          <button class="page-link" (click)="cambiarPagina(page)">{{ page }}</button>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="cambiarPagina(currentPage + 1)" title="Siguiente">
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>

<app-bulk-import *ngIf="showBulkImport" [companyId]="companyId" (importClosed)="handleBulkImportClose($event)">
</app-bulk-import>
