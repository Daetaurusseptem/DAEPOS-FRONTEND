<div class="layout-wrapper">
    <app-dashboard-sidebar></app-dashboard-sidebar>

    <div class="layout-content" [class.collapsed]="isCollapsed">
        <!-- Encabezado Superior Stark con Centro de Notificaciones y Fecha Cajas -->
        <header class="top-header d-flex justify-content-between align-items-center bg-white border-bottom px-4 py-2.5">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-dark btn-sm rounded-circle d-md-none border-light-subtle shadow-none d-flex align-items-center justify-content-center" 
                        style="width: 32px; height: 32px;"
                        (click)="sidebarService.toggle()">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fw-semibold text-dark fs-6 tracking-tight">DaePoint <span class="text-secondary fw-normal">SaaS</span></span>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Fecha Actual sutil -->
                <span class="text-muted d-none d-md-inline font-monospace" style="font-size: 0.72rem;">
                    {{ currentDate | date:'dd MMM, yyyy' }}
                </span>

                <!-- Centro de Notificaciones -->
                <app-notification-center></app-notification-center>
                
                <!-- Separador vertical -->
                <div class="vr bg-light-subtle d-none d-md-block" style="height: 18px; width: 1px; background-color: #ddd;"></div>

                <!-- Perfil del Usuario Stark -->
                <div class="d-flex align-items-center gap-2 px-2.5 py-1 border border-light-subtle rounded-pill bg-light-subtle ps-2 pe-3" 
                     *ngIf="authService.usuario">
                    <div class="avatar-circle rounded-circle bg-dark text-white fw-bold d-flex align-items-center justify-content-center" 
                         style="width: 28px; height: 28px; font-size: 0.78rem;">
                        {{ authService.usuario.name.charAt(0).toUpperCase() }}
                    </div>
                    <div class="d-flex flex-column min-w-0" style="line-height: 1.15;">
                        <span class="fw-bold text-dark text-truncate" style="font-size: 0.72rem; max-width: 120px;">
                            {{ authService.usuario.name }}
                        </span>
                        <span class="text-muted text-uppercase font-monospace" style="font-size: 0.52rem; letter-spacing: 0.5px;">
                            {{ authService.usuario.role }}
                        </span>
                    </div>
                </div>
            </div>
        </header>

        <main class="content-area animate__animated animate__fadeIn">
            <app-spinner></app-spinner>
            <router-outlet></router-outlet>
        </main>
        <app-footer></app-footer>
    </div>
</div>

<modal-img></modal-img>
